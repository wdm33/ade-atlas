name: Build & deploy Ade Atlas

# Polls the ade repo every 10 minutes (and on pushes to ade-atlas / manual
# dispatch), parses its grounding docs + registry into site-data, builds the
# Astro site, and deploys to GitHub Pages.
#
# Source-of-truth wiring:
#   - Set repo variable  ADE_REPO   to the ade node repo slug (e.g. "wdm33/ade").
#   - Set repo variable  ADE_REF    (optional) to pin a ref/branch; default: ade default branch.
#   - If the ade repo is private, set secret  ADE_REPO_TOKEN  (a read-scoped PAT).
# When ADE_REPO is unset, the build falls back to the committed mock docs at the repo root.
#
# Scheduled runs short-circuit when ade's main SHA matches the SHA already
# deployed (read from the live manifest.json), so ~144 cron runs/day cost
# ~2 seconds each unless ade actually moved. Push / workflow_dispatch always build.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "ade repo ref to pin (overrides ADE_REF)"
        required: false
  repository_dispatch:
    # Event-driven trigger from the ade repo's notify-atlas.yml — instant
    # rebuilds when grounding docs change. The cron stays as a fallback.
    types: [ade-docs-updated]
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.cmp.outputs.should_build }}
      ade_sha: ${{ steps.cmp.outputs.ade_sha }}
      deployed_sha: ${{ steps.cmp.outputs.deployed_sha }}
    steps:
      - id: cmp
        env:
          ADE_REPO: ${{ vars.ADE_REPO }}
          ADE_REF: ${{ github.event.inputs.ref || github.event.client_payload.sha || vars.ADE_REF }}
          GH_TOKEN: ${{ secrets.ADE_REPO_TOKEN || github.token }}
        run: |
          if [ -z "$ADE_REPO" ]; then
            echo "ADE_REPO unset (mock fallback) — building."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          REF="${ADE_REF:-main}"
          ADE_SHA="$(gh api "repos/${ADE_REPO}/commits/${REF}" -q '.sha[0:7]')"
          DEPLOYED_SHA="$(curl -fsSL https://wdm33.github.io/ade-atlas/site-data/manifest.json 2>/dev/null | jq -r '.repo_head // empty')"
          echo "ade_sha=$ADE_SHA"             >> "$GITHUB_OUTPUT"
          echo "deployed_sha=$DEPLOYED_SHA"   >> "$GITHUB_OUTPUT"
          echo "ade@$ADE_SHA  deployed@$DEPLOYED_SHA"
          if [ -n "$ADE_SHA" ] && [ "$ADE_SHA" = "$DEPLOYED_SHA" ]; then
            echo "No change since the deployed build — skipping."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Change detected — building."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    # Schedule runs only build when ade moved; pushes / manual dispatch always build.
    if: needs.check.outputs.should_build == 'true' || github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ade-atlas
        uses: actions/checkout@v4

      - name: Resolve ade source ref
        id: ref
        run: |
          REF="${{ github.event.inputs.ref || github.event.client_payload.sha || vars.ADE_REF }}"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Fetch ade docs (pinned)
        if: vars.ADE_REPO != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.ADE_REPO }}
          ref: ${{ steps.ref.outputs.ref }}
          token: ${{ secrets.ADE_REPO_TOKEN || github.token }}
          path: ade-source
          # Full history so the drift check can resolve the docs' stamped HEAD
          # (git log <stamp>..HEAD -- crates/); a shallow clone can't reach it.
          fetch-depth: 0

      - name: Stage source docs + pin metadata
        run: |
          mkdir -p source-docs
          if [ -n "${{ vars.ADE_REPO }}" ]; then
            cp ade-source/docs/ade-CODEMAP.md          source-docs/
            cp ade-source/docs/ade-SEAMS.md            source-docs/
            cp ade-source/docs/ade-HEAD_DELTAS.md      source-docs/
            cp ade-source/docs/ade-TRACEABILITY.md     source-docs/
            cp ade-source/docs/ade-invariant-registry.toml source-docs/
            # Fixed 7-char slice to match the check job's gh api .sha[0:7]; `git
            # rev-parse --short` can extend past 7 to avoid ambiguity and would
            # silently defeat the short-circuit's SHA equality compare.
            SHA="$(git -C ade-source rev-parse HEAD | cut -c1-7)"
            DATE="$(git -C ade-source log -1 --format=%cs)"
            printf '{ "repo_head": "%s", "github_repo": "%s", "generated_at": "%s" }\n' \
              "$SHA" "${{ vars.ADE_REPO }}" "$DATE" > source-docs/source-meta.json
            echo "ADE_REPO_DIR=$PWD/ade-source" >> "$GITHUB_ENV"
          else
            echo "ADE_REPO unset — falling back to committed mock docs."
            cp ade-*.md source-docs/
            cp ade-invariant-registry.toml source-docs/
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Parse docs → site-data (fail the build on hard drift)
        env:
          ADE_SOURCE_DIR: ${{ github.workspace }}/source-docs
          ADE_GITHUB_REPO: ${{ vars.ADE_REPO }}
        run: npm run build:data:check

      - name: Expose site-data as static assets (powers the short-circuit)
        run: |
          mkdir -p public/site-data
          cp -f site-data/*.json public/site-data/

      - name: Build site
        run: npx astro build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
